  <rect x="476" y="288" width="248" height="46" rx="9" fill="#fff6f7" stroke="#edc9d1"/>
  <text x="600" y="317" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5c2431">Constitution of Nepal PDF</text>
  <path d="M600 334v30" stroke="#c7193f" stroke-width="2"/>
  <polygon points="594,360 600,372 606,360" fill="#c7193f"/>
  <rect x="476" y="372" width="248" height="46" rx="9" fill="#fff6f7" stroke="#edc9d1"/>
  <text x="600" y="401" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5c2431">MiniLM embeddings · FAISS</text>
  <text x="476" y="447" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#637087">Answers only from retrieved passages.</text>

  <path d="M380 326h50" stroke="#315e9f" stroke-width="2.5"/>
  <polygon points="426,320 440,326 426,332" fill="#315e9f"/>
  <path d="M757 326h50" stroke="#315e9f" stroke-width="2.5"/>
  <polygon points="803,320 817,326 803,332" fill="#315e9f"/>

  <rect x="820" y="184" width="314" height="285" rx="18" fill="#172033" filter="url(#shadow)"/>
  <text x="852" y="229" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#93abd0">LANGGRAPH</text>
  <text x="852" y="270" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#fff">Agent graph</text>
  <text x="852" y="304" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#c7d2e5">OpenRouter or Groq</text>
