<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" role="img" aria-label="LangGraph Streamlit chat persistence flow">
  <rect width="1200" height="676" fill="#f7f8fb"/>
  <text x="600" y="58" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2430">LangGraph chat persistence</text>
  <text x="600" y="92" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#5b6573">Each chat is a thread. SQLite keeps the history.</text>

  <rect x="70" y="150" width="1060" height="160" rx="12" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="90" y="186" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" fill="#5b6573">STREAMLIT</text>
  <rect x="110" y="210" width="200" height="56" rx="8" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="210" y="245" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430">New message</text>
  <line x1="310" y1="238" x2="368" y2="238" stroke="#2b3340" stroke-width="2"/>
  <polygon points="368,232 386,238 368,244" fill="#2b3340"/>
  <rect x="386" y="210" width="200" height="56" rx="8" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="486" y="245" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430">Start New Chat</text>
  <line x1="586" y1="238" x2="644" y2="238" stroke="#2b3340" stroke-width="2"/>
  <polygon points="644,232 662,238 644,244" fill="#2b3340"/>
  <rect x="662" y="210" width="220" height="56" rx="8" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="772" y="245" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430">Open old thread</text>
  <line x1="882" y1="238" x2="940" y2="238" stroke="#2b3340" stroke-width="2"/>
  <polygon points="940,232 958,238 940,244" fill="#2b3340"/>
  <rect x="958" y="210" width="140" height="56" rx="8" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="1028" y="245" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430">thread_id</text>

  <line x1="600" y1="310" x2="600" y2="360" stroke="#2b3340" stroke-width="2"/>
  <polygon points="594,360 600,378 606,360" fill="#2b3340"/>

  <rect x="70" y="378" width="1060" height="130" rx="12" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="90" y="414" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" fill="#5b6573">LANGGRAPH</text>
  <rect x="200" y="430" width="240" height="48" rx="8" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="320" y="460" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430">Graph + model</text>
  <line x1="440" y1="454" x2="498" y2="454" stroke="#2b3340" stroke-width="2"/>
  <polygon points="498,448 516,454 498,460" fill="#2b3340"/>
  <rect x="516" y="430" width="220" height="48" rx="8" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="626" y="460" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430">Checkpointer</text>
  <line x1="736" y1="454" x2="794" y2="454" stroke="#2b3340" stroke-width="2"/>
  <polygon points="794,448 812,454 794,460" fill="#2b3340"/>
  <rect x="812" y="430" width="220" height="48" rx="8" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="922" y="460" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#1b2430">Save messages</text>

  <line x1="600" y1="508" x2="600" y2="548" stroke="#2b3340" stroke-width="2"/>
  <polygon points="594,548 600,566 606,548" fill="#2b3340"/>

  <rect x="330" y="566" width="540" height="72" rx="12" fill="#fff" stroke="#2b3340" stroke-width="2"/>
  <text x="600" y="610" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1b2430">SQLite chatbot.db stays after restart</text>
</svg>
