<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" role="img" aria-label="LangGraph chatbot with general tools, Constitution of Nepal RAG, LangSmith tracing, and persistent SQLite threads">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15233b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="676" fill="url(#paper)"/>
  <path d="M0 0h18v676H0z" fill="#dc143c"/>
  <path d="M18 0h7v676h-7z" fill="#173b73"/>

  <text x="66" y="62" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="2" fill="#637087">LANGGRAPH · STREAMLIT</text>
  <text x="66" y="106" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">Constitution RAG + useful tools</text>
  <text x="66" y="137" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#637087">Two modes. Streaming replies. Every conversation stays in its own thread.</text>

  <rect x="66" y="184" width="314" height="285" rx="18" fill="#fff" stroke="#ccd5e3" filter="url(#shadow)"/>
  <circle cx="108" cy="226" r="18" fill="#eaf1ff"/>
  <path d="M99 226h18M108 217v18" stroke="#2457a6" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="232" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">General mode</text>
  <text x="98" y="276" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#637087">TOOLS</text>
  <rect x="98" y="296" width="116" height="42" rx="8" fill="#f4f7fb" stroke="#d6deea"/>
  <text x="156" y="322" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#253147">Web search</text>
  <rect x="230" y="296" width="116" height="42" rx="8" fill="#f4f7fb" stroke="#d6deea"/>
  <text x="288" y="322" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#253147">Stock price</text>
  <rect x="98" y="352" width="116" height="42" rx="8" fill="#f4f7fb" stroke="#d6deea"/>
  <text x="156" y="378" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#253147">Calculator</text>
  <rect x="230" y="352" width="116" height="42" rx="8" fill="#f4f7fb" stroke="#d6deea"/>
  <text x="288" y="378" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#253147">MCP tools</text>
  <text x="98" y="434" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#637087">The model answers or calls an active tool.</text>

  <rect x="443" y="184" width="314" height="285" rx="18" fill="#fff" stroke="#ccd5e3" filter="url(#shadow)"/>
  <circle cx="485" cy="226" r="18" fill="#fff0f2"/>
  <path d="M477 216h16v21l-8-4-8 4z" fill="none" stroke="#c7193f" stroke-width="2.5" stroke-linejoin="round"/>
