  <circle cx="868" cy="414" r="7" fill="#74d6a4"/>
  <text x="890" y="420" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" fill="#eef4ff">Tool routing</text>

  <rect x="66" y="520" width="1068" height="105" rx="16" fill="#fff" stroke="#ccd5e3"/>
  <rect x="93" y="545" width="300" height="55" rx="10" fill="#f4f7fb"/>
  <circle cx="120" cy="572" r="10" fill="#315e9f"/>
  <text x="143" y="578" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#253147">SQLite persistent threads</text>
  <rect x="450" y="545" width="300" height="55" rx="10" fill="#f4f7fb"/>
  <circle cx="477" cy="572" r="10" fill="#6d55b7"/>
  <text x="500" y="578" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#253147">LangSmith tracing</text>
  <rect x="807" y="545" width="300" height="55" rx="10" fill="#f4f7fb"/>
  <circle cx="834" cy="572" r="10" fill="#c7193f"/>
  <text x="857" y="578" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#253147">Streamlit live app</text>
